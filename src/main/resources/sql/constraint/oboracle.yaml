list-constraint-columns: |-
  SELECT
    OWNER,
    TABLE_NAME,
    COLUMN_NAME,
    DATA_TYPE,
    DATA_TYPE_OWNER,
    DATA_LENGTH,
    DATA_PRECISION,
    DATA_SCALE,
    NULLABLE,
    COLUMN_ID,
    DEFAULT_LENGTH,
    HIDDEN_COLUMN,
    VIRTUAL_COLUMN
  FROM
    ALL_TAB_COLS
  WHERE
    OWNER=?
    AND TABLE_NAME=?
    AND COLUMN_NAME=?
