list-pk-constraints: |-
  SELECT
    o.OWNER,
    o.CONSTRAINT_NAME,
    o.TABLE_NAME,
    o.COLUMN_NAME,
    o.POSITION
  FROM
    (
      SELECT
        *
      FROM
        ALL_CONSTRAINTS
      WHERE
        CONSTRAINT_TYPE='P'
    ) s
    INNER JOIN ALL_CONS_COLUMNS o ON
    s.OWNER=o.OWNER
    AND s.TABLE_NAME=o.TABLE_NAME
    AND s.CONSTRAINT_NAME=o.CONSTRAINT_NAME
  WHERE
    s.OWNER=?
    AND s.TABLE_NAME=?
